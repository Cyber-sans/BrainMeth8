# Brainmeth Distant Horizons baseline for DH 3.3.3 / config schema v5.
# Generate missing distant terrain on the dedicated server and serve LODs to clients.
# Current DH 3.3.3 keys are validated by scripts/validate.sh.
_version = 5

[server]
enableServerGeneration = true

[common.worldGenerator]
enableDistantGeneration = true
distantGeneratorMode = "INTERNAL_SERVER"
