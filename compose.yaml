name: brainmeth

x-minecraft-common: &minecraft-common
  image: itzg/minecraft-server:java25-graalvm
  pull_policy: daily
  restart: unless-stopped
  stop_grace_period: 1m
  depends_on:
    packwiz:
      condition: service_healthy
  networks:
    - brainmeth
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment: &minecraft-environment
    EULA: "TRUE"
    TYPE: "NEOFORGE"
    VERSION: "26.2"
    NEOFORGE_VERSION: "26.2.0.88"
    PACKWIZ_URL: "http://packwiz/pack.toml"
    UID: "1000"
    GID: "1000"
    MEMORY: "${MEMORY:-6G}"
    USE_MEOWICE_FLAGS: "true"
    USE_MEOWICE_GRAALVM_FLAGS: "true"
    MODE: "survival"
    DIFFICULTY: "hard"
    PVP: "true"
    ONLINE_MODE: "true"
    ENABLE_WHITELIST: "false"
    MAX_PLAYERS: "${MAX_PLAYERS:-12}"
    VIEW_DISTANCE: "${VIEW_DISTANCE:-8}"
    SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-6}"
    ENABLE_RCON: "true"
    RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
    GENERATE_LOG4J2_CONFIG: "true"
    ROLLING_LOG_MAX_FILES: "30"
    TZ: "${TZ:-Europe/London}"
  secrets:
    - rcon_password
  tty: true
  stdin_open: true

services:
  # Serves the Packwiz definition only on the private Docker network.
  # This lets the GitHub repository remain private.
  packwiz:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./pack:/usr/share/nginx/html:ro
    networks:
      - brainmeth
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/pack.toml || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  minecraft-prod:
    <<: *minecraft-common
    profiles: ["prod"]
    container_name: brainmeth-prod
    environment:
      <<: *minecraft-environment
      MOTD: "${MOTD:-Brainmeth}"
    ports:
      - "25565:25565/tcp"
      - "${VOICE_PORT_PROD:-24454}:24454/udp"
    volumes:
      - "${PROD_DATA_DIR:-/srv/minecraft}:/data"

  minecraft-test:
    <<: *minecraft-common
    profiles: ["test"]
    container_name: brainmeth-test
    environment:
      <<: *minecraft-environment
      MOTD: "Brainmeth TEST"
      MAX_PLAYERS: "4"
    ports:
      - "25566:25565/tcp"
      - "${VOICE_PORT_TEST:-24455}:24454/udp"
    volumes:
      - "${TEST_DATA_DIR:-/srv/minecraft-test}:/data"

networks:
  brainmeth:
    name: brainmeth

secrets:
  rcon_password:
    file: ./secrets/rcon_password.txt
