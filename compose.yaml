name: brainmeth

x-minecraft-common: &minecraft-common
  image: itzg/minecraft-server:java25-graalvm
  pull_policy: daily
  restart: unless-stopped
  stop_grace_period: 1m
  labels:
    com.centurylinklabs.watchtower.enable: "false"
  depends_on:
    packwiz:
      condition: service_healthy
  networks:
    - brainmeth
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment: &minecraft-environment
    EULA: "TRUE"
    TYPE: "NEOFORGE"
    VERSION: "26.2"
    NEOFORGE_VERSION: "26.2.0.88"
    PACKWIZ_URL: "http://packwiz/pack.toml"
    UID: "1000"
    GID: "1000"
    MEMORY: "${MEMORY:-6G}"
    USE_MEOWICE_FLAGS: "true"
    USE_MEOWICE_GRAALVM_FLAGS: "true"
    MODE: "survival"
    DIFFICULTY: "hard"
    PVP: "true"
    ONLINE_MODE: "true"
    ENABLE_WHITELIST: "false"
    MAX_PLAYERS: "${MAX_PLAYERS:-12}"
    VIEW_DISTANCE: "${VIEW_DISTANCE:-8}"
    SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-6}"
    ENABLE_RCON: "true"
    RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
    GENERATE_LOG4J2_CONFIG: "true"
    ROLLING_LOG_MAX_FILES: "30"
    TZ: "${TZ:-Europe/London}"
  secrets:
    - rcon_password
  tty: true
  stdin_open: true

services:
  # Serves the Packwiz definition only on the private Docker network.
  # This lets the GitHub repository remain private.
  packwiz:
    image: nginx:1.27-alpine
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - ./pack:/usr/share/nginx/html:ro
    networks:
      - brainmeth
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/pack.toml || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  minecraft-prod:
    <<: *minecraft-common
    profiles: ["prod"]
    container_name: brainmeth-prod
    environment:
      <<: *minecraft-environment
      MOTD: "${MOTD:-Brainmeth}"
    ports:
      - "${MC_PORT_PROD:-25577}:25565/tcp"
      - "${VOICE_PORT_PROD:-25576}:24454/udp"
    volumes:
      - "${PROD_DATA_DIR:-/srv/minecraft/brainmeth/prod}:/data"


  minecraft-backup:
    image: itzg/mc-backup:latest
    pull_policy: daily
    profiles: ["prod"]
    container_name: brainmeth-backup
    restart: unless-stopped
    depends_on:
      minecraft-prod:
        condition: service_healthy
    networks:
      - brainmeth
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      RCON_HOST: "minecraft-prod"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      # Built-in cron runs inside the backup container.
      # Default starts warnings at 04:50 local time so the archive begins at ~05:00.
      CRON_SCHEDULE: "${BACKUP_CRON:-50 4 * * *}"
      CRON_BACKUP_UID: "1000"
      PRE_SAVE_ALL_SCRIPT: |-
        rcon-cli say "Server backup in 10 minutes."
        sleep 5m
        rcon-cli say "Server backup in 5 minutes."
        sleep 4m
        rcon-cli say "Server backup in 60 seconds."
        sleep 60s
      BACKUP_METHOD: "tar"
      TAR_COMPRESS_METHOD: "zstd"
      PRUNE_BACKUPS_DAYS: "0"
      PRUNE_BACKUPS_COUNT: "${BACKUP_KEEP_COUNT:-28}"
      TZ: "${TZ:-Europe/London}"
    secrets:
      - rcon_password
    volumes:
      - "${PROD_DATA_DIR:-/srv/minecraft/brainmeth/prod}:/data:ro"
      - "${BACKUP_DIR:-/mnt/Backup3TB/minecraft/brainmeth/backups}:/backups"
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minecraft-test:
    <<: *minecraft-common
    profiles: ["test"]
    container_name: brainmeth-test
    environment:
      <<: *minecraft-environment
      MOTD: "Brainmeth TEST"
      MAX_PLAYERS: "4"
      MEMORY: "${TEST_MEMORY:-3G}"
    ports:
      - "${MC_PORT_TEST:-25575}:25565/tcp"
      - "${VOICE_PORT_TEST:-25574}:24454/udp"
    volumes:
      - "${TEST_DATA_DIR:-/srv/minecraft/brainmeth/test}:/data"

networks:
  brainmeth:
    name: brainmeth

secrets:
  rcon_password:
    file: ./secrets/rcon_password.txt
