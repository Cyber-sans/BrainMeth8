name: Build Brainmeth precision orbital railgun
on:
  push:
    branches: [migration/neoforge-1.21.1]
    paths:
      - 'scripts/build-precision-railgun.py'
      - '.github/workflows/build-precision-railgun.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: precision-railgun-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Patch and build MIT-licensed Orbital Railgun
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-precision-railgun.py --workdir "$RUNNER_TEMP/brainmeth-railgun"
          (cd "$RUNNER_TEMP/brainmeth-railgun" && gradle --no-daemon clean build)
          mapfile -t jars < <(find "$RUNNER_TEMP/brainmeth-railgun/build/libs" -maxdepth 1 -name '*.jar' ! -name '*sources*' | sort)
          [[ ${#jars[@]} -eq 1 ]] || { printf 'Unexpected JAR list: %s\n' "${jars[*]}"; exit 1; }
          (cd "$RUNNER_TEMP/brainmeth-railgun" && zip -q "${jars[0]}" LICENSE)
          unzip -t "${jars[0]}" >/dev/null
          unzip -p "${jars[0]}" META-INF/neoforge.mods.toml | grep -q 'orbital_railgun'
          mkdir -p server-mods
          cp "${jars[0]}" server-mods/brainmeth-precision-railgun.jar
          sha256sum server-mods/brainmeth-precision-railgun.jar
      - name: Publish verified patched JAR (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp server-mods/brainmeth-precision-railgun.jar "$RUNNER_TEMP/precision-built.jar"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p server-mods
            cp "$RUNNER_TEMP/precision-built.jar" server-mods/brainmeth-precision-railgun.jar
            git add server-mods/brainmeth-precision-railgun.jar
            if git diff --cached --quiet; then
              echo "Current branch already contains the exact built JAR."
              exit 0
            fi
            git commit -m "Build one-block-only Orbital Railgun visual mod"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
