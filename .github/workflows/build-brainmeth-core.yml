name: Build Brainmeth server launch mod

on:
  push:
    branches:
      - migration/neoforge-1.21.1
    paths:
      - 'custom-mods/brainmeth-core/**'
      - '.github/workflows/build-brainmeth-core.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brainmeth-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      # Rebuild on the latest remote revision before publishing. Binary JARs
      # cannot be rebased reliably if another run has updated the same file.
      - name: Compile and publish latest server-only mod
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
            (cd custom-mods/brainmeth-core && gradle --no-daemon clean build)
            mkdir -p server-mods
            found=(custom-mods/brainmeth-core/build/libs/brainmeth_core-*.jar)
            [[ ${#found[@]} -eq 1 && -s "${found[0]}" ]]
            cp "${found[0]}" server-mods/brainmeth-core.jar
            unzip -t server-mods/brainmeth-core.jar >/dev/null
            python3 scripts/check-brainmeth-jar.py server-mods/brainmeth-core.jar
            sha256sum server-mods/brainmeth-core.jar
            git add server-mods/brainmeth-core.jar
            if git diff --cached --quiet; then
              echo "Mod JAR already matches latest branch."
              exit 0
            fi
            git commit -m "Build Brainmeth server-only launch mod"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Concurrent branch update; rebuilding from latest revision (attempt $attempt)."
          done
          echo "Unable to publish JAR after three retries" >&2
          exit 1
