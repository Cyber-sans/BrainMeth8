name: Sync Packwiz base mods

on:
  push:
    paths:
      - "pack/base-mods.txt"
      - "pack/curseforge-mods.txt"
      - "pack/side-overrides.json"
      - "pack/config/**"
      - "scripts/apply-packwiz-sides.py"
      - "scripts/validate.sh"
      - "scripts/deploy.sh"
      - "scripts/verify-game-rules.py"
      - "rules/**"
      - ".github/workflows/sync-base-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packwiz-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Rebuild curated base mod metadata
        working-directory: pack
        shell: bash
        run: |
          set -euo pipefail
          # NeoForge only scans /mods itself, not nested /mods/base.
          # Keep all generated Packwiz mod metadata directly under pack/mods/.
          rm -rf mods/base
          mkdir -p mods
          find mods -maxdepth 1 -type f -name '*.pw.toml' -delete

          while IFS= read -r spec || [[ -n "$spec" ]]; do
            [[ -z "$spec" || "$spec" =~ ^[[:space:]]*# ]] && continue
            echo "Adding $spec"
            packwiz --meta-folder mods modrinth add "$spec" -y
          done < base-mods.txt

          # Official CurseForge-only mods are listed separately because the
          # Modrinth resolver cannot install them. Explicit project:file pins.
          while IFS= read -r spec || [[ -n "$spec" ]]; do
            [[ -z "$spec" || "$spec" =~ ^[[:space:]]*# ]] && continue
            IFS=: read -r addon_id file_id <<< "$spec"
            echo "Adding CurseForge $addon_id file $file_id"
            packwiz --meta-folder mods curseforge add --addon-id "$addon_id" --file-id "$file_id" -y
          done < curseforge-mods.txt

          python ../scripts/apply-packwiz-sides.py
          packwiz refresh
          packwiz list -v

      - name: Validate migration deployment structure
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/validate.sh scripts/deploy.sh
          mkdir -p secrets
          printf 'ci-placeholder-only\n' > secrets/rcon_password.txt
          bash scripts/validate.sh

      - name: Commit generated Packwiz metadata
        shell: bash
        run: |
          set -euo pipefail
          git add pack/
          if git diff --cached --quiet; then
            echo "Pack already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Brainmeth base Packwiz mods"
          git push
