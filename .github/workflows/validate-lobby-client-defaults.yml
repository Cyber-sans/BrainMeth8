name: Validate Brainmeth lobby and client defaults

on:
  push:
    branches:
      - migration/neoforge-1.21.1
    paths:
      - 'rules/brainmeth-rules/data/brainmeth/function/lobby/**'
      - 'rules/client-config/**'
      - 'scripts/stage-client-mods.py'
      - 'scripts/verify-lobby.py'
      - 'scripts/verify-resource-packs.py'
      - 'scripts/verify-game-rules.py'
      - '.github/workflows/validate-lobby-client-defaults.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check geometry, scoreboard commands and default resource packs
        run: |
          python3 scripts/verify-lobby.py
          python3 scripts/verify-game-rules.py
          python3 scripts/verify-resource-packs.py
          python3 -m py_compile scripts/stage-client-mods.py scripts/verify-lobby.py scripts/verify-game-rules.py scripts/verify-resource-packs.py
      - name: Verify AutoModpack no longer distributes self-rewritten Default Options config
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/pack/mods" "$tmp/data/automodpack/host-modpack/main/config"
          printf 'old bad default config\\n' > "$tmp/data/automodpack/host-modpack/main/config/defaultoptions-common.toml"
          python3 scripts/stage-client-mods.py --pack-root "$tmp/pack" --data-root "$tmp/data"
          test ! -e "$tmp/data/automodpack/host-modpack/main/config/defaultoptions-common.toml"
