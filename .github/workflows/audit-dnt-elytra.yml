name: Verify and regenerate DnT loot restrictions
on:
  push:
    paths:
      - ".github/workflows/audit-dnt-elytra.yml"
      - "scripts/generate-dnt-loot-overrides.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Regenerate from exact SHA-verified DnT 4.4.4 JAR
        run: python3 scripts/generate-dnt-loot-overrides.py

      - name: Commit only targeted loot-table overrides
        run: |
          set -euo pipefail
          git add rules/brainmeth-rules/data/nova_structures/loot_table/
          if git diff --cached --quiet; then
            echo "Dungeons and Taverns loot overrides are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove DnT bonus Elytra and banned enchantments from vault loot"
          git push
